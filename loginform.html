<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Form</title>
<style>

    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: aliceblue;
}

.visitor-container {
    min-height: 100vh;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.visitor-form {
    width: 450px;
    max-width: 100%;
    background-color: white;
    padding: 30px;
    border-radius: 25px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
}

.visitor-form h2 {
    text-align: center;
    font-size: 26px;
    margin-bottom: 8px;
}

.form-title {
    text-align: center;
    color: rgb(134, 140, 145);
    margin-bottom: 25px;
}

.input-group {
    margin-bottom: 18px;
}

.input-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
    font-size: 15px;
}

.input-group input {
    width: 100%;
    height: 46px;
    padding: 0 14px;
    border: 1px solid #d5d5d5;
    border-radius: 10px;
    outline: none;
    font-size: 15px;
}

.input-group input:focus {
    border-color: rgb(96, 169, 197);
}

.submit-btn {
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 12px;
    background-color: rgb(96, 169, 197);
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.submit-btn:hover {
    background-color: rgb(75, 150, 180);
}


/* Mobile Responsive */

@media (max-width: 500px) {

    .visitor-container {
        padding: 15px;
    }

    .visitor-form {
        width: 100%;
        padding: 25px 20px;
        border-radius: 20px;
    }

    .visitor-form h2 {
        font-size: 23px;
    }

    .input-group input {
        height: 45px;
    }

    .submit-btn {
        height: 47px;
    }
}
</style>
</head>
<body>

    <div class="visitor-container">

        <div class="visitor-form">

            <h2>Visitor Details</h2>
            <p class="form-title">Please enter your details</p>

            <form>

                <div class="input-group">
                    <label>Visitor Name</label>
                    <input type="text" placeholder="Enter your name">
                </div>

                <div class="input-group">
                    <label>Mobile Number</label>
                    <input type="tel" placeholder="Enter mobile number">
                </div>

                <div class="input-group">
                    <label>Whom To Meet</label>
                    <input type="text" placeholder="Enter person's name">
                </div>

                <div class="input-group">
                    <label>Purpose of Visit</label>
                    <input type="text" placeholder="Enter purpose of visit">
                </div>

                <div class="input-group">
                    <label>Company / Organization</label>
                    <input type="text" placeholder="Enter company name">
                </div>

                <button type="submit" class="submit-btn">
                    Check In
                </button>

            </form>

        </div>

    </div>

</body>
</html>
